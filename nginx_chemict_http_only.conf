server {
    listen 80;
    listen [::]:80;
    
    server_name chemict.com www.chemict.com;
    
    # Logs
    access_log /var/log/nginx/chemict.com.access.log;
    error_log /var/log/nginx/chemict.com.error.log;
    
    # Client max body size (for file uploads)
    client_max_body_size 50M;
    
    # Proxy to Flask app on port 8006
    location / {
        proxy_pass http://0.0.0.0:8006;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        
        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    
    # Static files
    location /static {
        alias /var/www/chemict/static;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    
    # Favicon
    location = /favicon.ico {
        alias /var/www/chemict/static/favicon.ico;
        access_log off;
        log_not_found off;
    }
}
